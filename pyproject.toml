[project]
name = "orderflow"
version = "0.1.0"
description = "Extract structured order-flow data from GoCharting footprint screenshots (no LLM)"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
